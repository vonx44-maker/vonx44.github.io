<!DOCTYPE html>

    <style>
     .balloon {
    position: fixed;
    bottom: -100px;
    width: 60px;
    height: 80px;
    border-radius: 50%;
    z-index: 9999;
    opacity: 0.8;
    animation: float 14s ease-in-out infinite;

}
    .balloon::before {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 10px solid #B57EDC;
}

.balloon::after {
    content: "";
    position: absolute;
    top: 72px;
    left: 50%;
    width: 20px;
    height: 90px;
    border-left: 2px solid #B57EDC;
    border-bottom: 2px solid #B57EDC;
    border-radius: 0 0 0 100%;
    opacity: 0.6;
}

.balloon:nth-of-type(1) {
    left: 10%;
    background: #E6CCFF;
}

.balloon:nth-of-type(2) {
    left: 30%;
    background: #D8B4F8;
    animation-delay: 2s;
}

.balloon:nth-of-type(3) {
    left: 50%;
    background: #CFA7F5;
    animation-delay: 4s;
}

.balloon:nth-of-type(4) {
    left: 70%;
    background: #E0BBE4;
    animation-delay: 6s;
}

.balloon:nth-of-type(5) {
    left: 90%;
    background: #D8BFD8;
    animation-delay: 8s;
}
    .balloon:nth-of-type(1)::after {
    transform: rotate(-10deg);
}

.balloon:nth-of-type(2)::after {
    transform: rotate(8deg);
}

.balloon:nth-of-type(3)::after {
    transform: rotate(-5deg);
}

.balloon:nth-of-type(4)::after {
    transform: rotate(12deg);
}

.balloon:nth-of-type(5)::after {
    transform: rotate(-8deg);
}
      
@keyframes float {
    0% {
        transform: translate(0, 0) rotate(-2deg);
    }

    25% {
        transform: translate(-15px, -35vh) rotate(2deg);
    }

    50% {
        transform: translate(15px, -70vh) rotate(-2deg);
    }

    75% {
        transform: translate(-10px, -105vh) rotate(2deg);
    }

    100% {
        transform: translate(10px, -140vh) rotate(-2deg);
    }
}
    </style>
    
  </head>
