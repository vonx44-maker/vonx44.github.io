    <style>
     .balloon {
    position: fixed;
    bottom: -100px;
    width: 60px;
    height: 80px;
    border-radius: 50%;
    z-index: 9999;
    opacity: 0.8;
    animation: float 14s ease-in-out infinite;

}
    .balloon::before {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 10px solid #B57EDC;
}

.balloon::after {
    content: "";
    position: absolute;
    top: 75px;
    left: 50%;
    width: 0;
    height: 90px;
    border-left: 2px solid #B57EDC;
    transform: translateX(-50%);
    opacity: 0.6;
}

.balloon:nth-of-type(1) {
    left: 20%;
    background: #E6CCFF;
}

.balloon:nth-of-type(2) {
    left: 30%;
    background: #D8B4F8;
    animation-delay: 2s;
}

.balloon:nth-of-type(3) {
    left: 50%;
    background: #CFA7F5;
    animation-delay: 4s;
}

.balloon:nth-of-type(4) {
    left: 70%;
    background: #E0BBE4;
    animation-delay: 6s;
}

.balloon:nth-of-type(5) {
    left: 90%;
    background: #D8BFD8;
    animation-delay: 8s;
}
    .balloon:nth-of-type(1)::after {
    transform: rotate(-10deg);
}

.balloon:nth-of-type(2)::after {
    transform: rotate(8deg);
}

.balloon:nth-of-type(3)::after {
    transform: rotate(-5deg);
}

.balloon:nth-of-type(4)::after {
    transform: rotate(12deg);
}

.balloon:nth-of-type(5)::after {
    transform: rotate(-8deg);
}
#welcome-screen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(135deg,#e9d5ff,#d8b4fe);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10000;
    color:white;
    text-align:center;
    overflow:hidden;
    animation:fadeOut 1.5s ease forwards;
    animation-delay:3s;
}
      .sparkle{
    position:absolute;
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white;
    animation:twinkle 2s infinite ease-in-out;
}

.sparkle:nth-child(1){top:10%;left:20%;}
.sparkle:nth-child(2){top:25%;left:70%;}
.sparkle:nth-child(3){top:40%;left:50%;}
.sparkle:nth-child(4){top:60%;left:25%;}
.sparkle:nth-child(5){top:75%;left:80%;}
.sparkle:nth-child(6){top:15%;left:85%;}
.sparkle:nth-child(7){top:85%;left:40%;}
.sparkle:nth-child(8){top:50%;left:10%;}
.sparkle:nth-child(9){top:35%;left:90%;}
.sparkle:nth-child(10){top:90%;left:60%;}

@keyframes twinkle{
    0%,100%{
        opacity:.2;
        transform:scale(.5);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

#welcome-screen h1{
    font-size:60px;
    margin:0;
    font-family:'Great Vibes',cursive;
    animation:zoomIn 1.5s ease;
}

#welcome-screen p{
    font-size:20px;
}

@keyframes zoomIn{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}      
      
@keyframes float {
    0% {
        transform: translate(0, 0) rotate(-2deg);
    }

    25% {
        transform: translate(-15px, -35vh) rotate(2deg);
    }

    50% {
        transform: translate(15px, -70vh) rotate(-2deg);
    }

    75% {
        transform: translate(-10px, -105vh) rotate(2deg);
    }

    100% {
        transform: translate(10px, -140vh) rotate(-2deg);
    }
}
    </style>
