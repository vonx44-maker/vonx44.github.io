<!DOCTYPE html>

  <title>Vien's 1st Birthday & Christening</title>

    <style>

      .balloon {
        position: fixed;
        bottom: -120px;
        width: 60px;
        height: 80px;
        background: #D8B4F8;
        border-radius: 50%;
        animation: float 12s linear infinite;
        opacity: 0.8;
        z-index: 999;
        pointer-events: none;
      }
      
      .balloon:after {
        content: "";
        position: absolute;
        left: 28px;
        top: 75px;
        width: 2px;
        height: 60px;
        background: #B57EDC;
      }
      
      .balloon:nth-of-type(1) {
        left: 10%;
        background: #E6CCFF;
        animation-delay: 0s;
      }
      
      .balloon:nth-of-type(2) {
        left: 30%;
        background: #D8B4F8;
        animation-delay: 3s;
      }

      .balloon:nth-of-type(3) {
        left: 50%;
        background: #CFA7F5;
        animation-delay: 6s;
      }
      .balloon:nth-of-type(4) {
        left: 70%;
        background: #E0BBE4;
        animation-delay: 9s;
      }
      .balloon:nth-of-type(5) {
        left: 90%;
        background: #D8BFD8;
        animation-delay: 12s;
      }

      @keyframes float {
        from {
          transform: translateY(0);

      to {
          transform: translateY(-130vh);
      }
      }
      
    </style>
    
  </head>

  <body style="margin:0;">
